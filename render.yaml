services:
  - type: web
    name: mechanic-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npm run db:migrate
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false   # paste your Prisma Postgres connection string in the Render dashboard
      - key: FRONTEND_URL
        sync: false   # your Vercel URL, e.g. https://mechanic-booking.vercel.app
